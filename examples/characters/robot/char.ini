; Block-encoded character (preferred format). `model` marks it 3D.
[options]
name = Robot
showname = Robot
side = wit
model = robot.pmx

[emotions]
number = 2
1 = idle
2 = objection

[emote idle]
anim = idle_loop

[emote objection]
anim      = objection
preanim   = point
sound     = objection
sounddelay = 480
modifier  = zoom
deskmod   = 1
